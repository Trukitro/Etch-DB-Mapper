<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 256" width="900" height="256">
  <defs>
    <!-- Estilos de texto -->
    <style>
      .title-bold { 
        font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; 
        font-size: 72px; 
        font-weight: 800; 
        fill: #FFFFFF; 
      }
      .title-light { 
        font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; 
        font-size: 72px; 
        font-weight: 300; 
        fill: #46B9D4; 
      }
      .subtitle { 
        font-family: 'Consolas', 'Courier New', monospace; 
        font-size: 24px; 
        font-weight: 400; 
        fill: #39FF14; 
        letter-spacing: 2px;
      }
    </style>
    
    <!-- Reutilización exacta de los defs del icono -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2"/>
    </pattern>
    <g id="db-node">
      <path d="M0,35 v90 c0,19 35,35 80,35 c45,0 80,-16 80,-35 v-90 Z" fill="#185B6B"/>
      <path d="M0,65 c0,19 35,35 80,35 c45,0 80,-16 80,-35" fill="none" stroke="#0B2B36" stroke-width="5"/>
      <path d="M0,95 c0,19 35,35 80,35 c45,0 80,-16 80,-35" fill="none" stroke="#0B2B36" stroke-width="5"/>
      <ellipse cx="80" cy="35" rx="80" ry="35" fill="#29A0B1"/>
      <ellipse cx="80" cy="35" rx="65" ry="25" fill="#46B9D4"/>
    </g>
  </defs>

  <!-- Grupo del Icono (Escalado para ajustarse a la izquierda) -->
  <g transform="translate(16, 16) scale(0.4375)">
    <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="#0A1E29" />
    <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#grid)" />
    <use href="#db-node" x="90" y="240" transform="scale(1.1) translate(-10, -20)" />
    <use href="#db-node" x="280" y="130" transform="scale(0.9) translate(30, 20)" />
    
    <g filter="url(#neon-glow)" fill="none" stroke="#39FF14" stroke-width="12" stroke-linejoin="miter" stroke-linecap="square">
      <path d="M 160 260 L 240 260 L 240 180 L 320 180" />
      <polygon points="315,165 340,180 315,195" fill="#39FF14" stroke="none" />
      <path d="M 370 260 L 370 340 L 250 340" />
      <polygon points="255,325 230,340 255,355" fill="#39FF14" stroke="none" />
    </g>
    <circle cx="160" cy="260" r="8" fill="#39FF14" />
    <circle cx="370" cy="260" r="8" fill="#39FF14" />
  </g>

  <!-- Tipografía del Logotipo -->
  <text x="270" y="135">
    <tspan class="title-bold">Etch-DB</tspan>
    <tspan class="title-light">-Mapper</tspan>
  </text>
  <text x="275" y="180" class="subtitle">&gt;_ SCHEMA MAPPING &amp; DATA URBANISM</text>
</svg>
