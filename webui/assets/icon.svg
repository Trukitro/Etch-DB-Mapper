<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filtro de brillo para el enrutamiento (Smart Routing) -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Patrón de cuadrícula (Fondo de urbanismo/blueprint) -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2"/>
    </pattern>

    <!-- Componente Base de Datos -->
    <g id="db-node">
      <!-- Cuerpo del cilindro -->
      <path d="M0,35 v90 c0,19 35,35 80,35 c45,0 80,-16 80,-35 v-90 Z" fill="#185B6B"/>
      <!-- Líneas de separación (tablas) -->
      <path d="M0,65 c0,19 35,35 80,35 c45,0 80,-16 80,-35" fill="none" stroke="#0B2B36" stroke-width="5"/>
      <path d="M0,95 c0,19 35,35 80,35 c45,0 80,-16 80,-35" fill="none" stroke="#0B2B36" stroke-width="5"/>
      <!-- Superficie superior -->
      <ellipse cx="80" cy="35" rx="80" ry="35" fill="#29A0B1"/>
      <ellipse cx="80" cy="35" rx="65" ry="25" fill="#46B9D4"/>
    </g>
  </defs>

  <!-- Fondo: Cuadrado redondeado oscuro -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="#0A1E29" />
  
  <!-- Cuadrícula de diseño (Mapper) -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#grid)" />

  <!-- Elementos de la Base de Datos -->
  <use href="#db-node" x="90" y="240" transform="scale(1.1) translate(-10, -20)" /> <!-- DB Principal Izquierda -->
  <use href="#db-node" x="280" y="130" transform="scale(0.9) translate(30, 20)" /> <!-- DB Secundaria Derecha -->

  <!-- Smart Routing: Líneas a 90 grados (Verde Neón) -->
  <g filter="url(#neon-glow)" fill="none" stroke="#39FF14" stroke-width="12" stroke-linejoin="miter" stroke-linecap="square">
    <!-- Ruta 1: De DB Izquierda a DB Derecha -->
    <path d="M 160 260 L 240 260 L 240 180 L 320 180" />
    <!-- Flecha Ruta 1 -->
    <polygon points="315,165 340,180 315,195" fill="#39FF14" stroke="none" />
    
    <!-- Ruta 2: De DB Derecha hacia abajo/izquierda (relaciones complejas) -->
    <path d="M 370 260 L 370 340 L 250 340" />
    <!-- Flecha Ruta 2 -->
    <polygon points="255,325 230,340 255,355" fill="#39FF14" stroke="none" />
  </g>
  
  <!-- Detalle: Nodos de anclaje de relaciones -->
  <circle cx="160" cy="260" r="8" fill="#39FF14" />
  <circle cx="370" cy="260" r="8" fill="#39FF14" />
</svg>
